# The scorer. Holds the season seed. It NEVER executes code from a pull request: tools/score_pr.sh
# copies only the experiment's JSON out of the PR head with `git show` and scores it with the code
# on main. Experiments are data (vs/dsl.py, vs/models.py). Code PRs are left for a person.
# Runs on every PR event and, as a sweeper, every 5 minutes, so no PR is ever dropped from the queue.
name: score
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: score
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-24.04
    environment: scorer        # the seed lives in this environment, usable from main only
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: "0"
      GH_TOKEN: ${{ github.token }}
      HELDOUT_SEED_JSON: ${{ secrets.HELDOUT_SEED_JSON }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with: { path: data/raw, key: "pins-${{ hashFiles('pins/sources.json') }}" }
      - run: python3 -m vs fetch
      - name: Score every open PR that has no verdict yet, oldest first
        run: |
          git config user.name "voynich-swarm-scorer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh label create scored --color 245c52 2>/dev/null || true
          for n in $(gh pr list --state open --json number,labels --jq '[.[] | select([.labels[].name] | index("scored") | not)] | sort_by(.number) | .[].number'); do
            bash tools/score_pr.sh "$n"
          done
