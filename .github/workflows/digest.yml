# The daily digest: tools/digest.py writes it from the record by rules (no model); this posts it to
# GitHub Discussions (Announcements) once a day and locks digest threads older than 7 days.
# Reads only main. Never runs code from a pull request.
name: digest
on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
permissions:
  contents: read
  discussions: write
  pull-requests: read
concurrency:
  group: digest
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with: { path: data/raw, key: "pins-${{ hashFiles('pins/sources.json') }}" }
      - run: python3 -m vs fetch
      - name: Write and post the digest
        run: |
          set -euo pipefail
          OWNER=${GITHUB_REPOSITORY%/*}; NAME=${GITHUB_REPOSITORY#*/}
          # open pull requests the scorer handed to a person (its comment says so)
          CODE=$(gh pr list --state open --limit 200 --json comments \
            --jq '[.[] | select(any(.comments[]; .body | test("reviewed by a person")))] | length')
          TITLE=$(python3 tools/digest.py --title)
          python3 tools/digest.py --open-code-prs "$CODE" > digest.md
          IDS=$(gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){id discussionCategories(first:25){nodes{id name}}}}' \
                -f o="$OWNER" -f n="$NAME" --jq '.data.repository.id + " " + (.data.repository.discussionCategories.nodes[] | select(.name=="Announcements") | .id)')
          REPO_ID=${IDS% *}; CAT=${IDS#* }
          EXISTING=$(gh api graphql -f query='query($o:String!,$n:String!,$c:ID!){repository(owner:$o,name:$n){discussions(first:20,categoryId:$c,orderBy:{field:CREATED_AT,direction:DESC}){nodes{title}}}}' \
                -f o="$OWNER" -f n="$NAME" -f c="$CAT" --jq '.data.repository.discussions.nodes[].title')
          if printf '%s\n' "$EXISTING" | grep -qxF "$TITLE"; then echo "already posted: $TITLE"; else
            gh api graphql -f query='mutation($r:ID!,$c:ID!,$t:String!,$b:String!){createDiscussion(input:{repositoryId:$r,categoryId:$c,title:$t,body:$b}){discussion{url}}}' \
              -f r="$REPO_ID" -f c="$CAT" -f t="$TITLE" -f b="$(cat digest.md)" --jq .data.createDiscussion.discussion.url
          fi
          # lock digest threads older than 7 days
          CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          for ID in $(gh api graphql -f query='query($o:String!,$n:String!,$c:ID!){repository(owner:$o,name:$n){discussions(first:50,categoryId:$c){nodes{id title locked createdAt}}}}' \
                -f o="$OWNER" -f n="$NAME" -f c="$CAT" \
                --jq ".data.repository.discussions.nodes[] | select(.title | startswith(\"Lead digest, \")) | select(.locked | not) | select(.createdAt < \"$CUTOFF\") | .id"); do
            gh api graphql -f query='mutation($id:ID!){lockLockable(input:{lockableId:$id,lockReason:RESOLVED}){clientMutationId}}' -f id="$ID" >/dev/null && echo "locked $ID"
          done
